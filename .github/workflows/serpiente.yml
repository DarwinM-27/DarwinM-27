name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 5 * * *"   # todos los días
  workflow_dispatch:       # botón para correrlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpiente-light.svg?palette=github-light&color_snake=#c8186a&color_dots=#1f5a5f,#ffc2e0,#ff6fb5,#c8186a,#5a2b8a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
